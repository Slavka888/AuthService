syntax = "proto3";

package auth_service;

option go_package = "slavka.auth.v1;authv1";

service Auth {
    rpc Register (RegisterRequest) returns (RegisterResponse);
    rpc Login (LoginRequest) returns (LoginResponse);
    rpc IsAdmin (IsAdminRequest) returns (IsAdminResponse);
}

message RegisterRequest {
    string email = 1; //Email of user to register
    string password = 2; //Password of user to register
}

message RegisterResponse {
    int64 user_id = 1; //User ID of the registered user
}

message LoginRequest {
    string email = 1; //User email to log in
    string password = 2; //User password to log in
    int32 app_id = 3; //ID for app to log in
}

message LoginResponse {
    string token = 1; //User's token
}

message IsAdminRequest {
    int64 user_id = 1; //User ID to validate
}

message IsAdminResponse {
    bool is_admin = 1; //Answer for user about admin
}